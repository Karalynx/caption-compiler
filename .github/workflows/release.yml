name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release - ${{ matrix.platform.os-name }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: true
      matrix:
        platform:
          - os-name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04

          - os-name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04

          - os-name: macOS-x86_64
            target: x86_64-apple-darwin
            runner: macos-latest

          - os-name: macOS-aarch64
            target: aarch64-apple-darwin
            runner: macos-latest

          - os-name: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest

          - os-name: windows-aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
            
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Get variables
        id: variables
        shell: bash
        run: |
          echo "channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= \"//; s/\"//')" >> $GITHUB_OUTPUT
          echo "exec-name=$(grep '^name' Cargo.toml | sed 's/.*= \"//; s/\"//')" >> $GITHUB_OUTPUT

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1.0.8
        with:
          command: build
          target: ${{ matrix.platform.target }}
          toolchain: ${{ steps.variables.outputs.channel }}
          args: "--locked --release"
          strip: true

      - name: Release
        uses: houseabsolute/actions-rust-release@v1.0.1
        with:
          executable-name: ${{ steps.variables.outputs.exec-name }}
          target: ${{ matrix.platform.target }}
          changes-file: ""